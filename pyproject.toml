[project]
name = "dog-nutrition-ai"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "", email = ""},
]
dependencies = ["langchain>=1.2.6", "langgraph>=1.0.6", "langchain-mcp-adapters>=0.2.1", "langchain-ollama>=1.0.1", "langgraph-cli>=0.4.11", "langgraph-api>=0.7.0", "langgraph-sdk>=0.3.3", "langchain-community>=0.4.1", "ddgs>=9.10.0"]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.scripts]
mcp = "mcp/server.py"
agent = "agent/agent.py"
server = "python -m langgraph_cli dev"

[tool.pdm]
distribution = false
